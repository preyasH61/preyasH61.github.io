# Correct: separate 'none' for branches, tags block triggers cleanly
trigger:
  branches:
    include:
      - none          # effectively disables branch triggers
  tags:
    include:
      - v*            # triggers on v1.0.0, v2.3.1, etc.

pool:
  vmImage: ubuntu-latest

stages:

# ── Detect which branch this tag was created from ──────────────────────
- stage: DetectBranch
  jobs:
  - job: Detect
    steps:
    - checkout: self
      fetchDepth: 0   # full history needed for branch detection

    - script: |
        # Fetch all remote refs so we can trace the tag
        git fetch --all --tags

        # Find which remote branch contains this commit
        BRANCH=$(git branch -r --contains $(Build.SourceVersion) \
          --format='%(refname:short)' 2>/dev/null \
          | grep -v HEAD \
          | head -n 1)

        echo "Detected branch: $BRANCH"

        # Determine target environment
        if echo "$BRANCH" | grep -q "feature"; then
          TARGET="feature"
        elif echo "$BRANCH" | grep -q "release"; then
          TARGET="release"
        else
          TARGET="unknown"
        fi

        echo "Target: $TARGET"

        # Set output variable — note the job name prefix in the output key
        echo "##vso[task.setvariable variable=targetEnv;isOutput=true]$TARGET"
      name: detectStep
      displayName: 'Detect branch from tag'

# ── DEV deploy (tag on a feature/* branch) ─────────────────────────────
- stage: DEV
  displayName: 'Deploy → DEV'
  dependsOn: DetectBranch
  # Correct stageDependencies syntax: Stage.Job.stepName.varName
  condition: |
    eq(dependencies.DetectBranch.outputs['Detect.detectStep.targetEnv'], 'feature')
  jobs:
  - deployment: DevDeploy
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "✅ Deploying to DEV"
            displayName: 'Deploy to DEV'

# ── SIT deploy (tag on a release/* branch) ─────────────────────────────
- stage: SIT
  displayName: 'Deploy → SIT'
  dependsOn: DetectBranch
  condition: |
    eq(dependencies.DetectBranch.outputs['Detect.detectStep.targetEnv'], 'release')
  jobs:
  - deployment: SITDeploy
    environment: sit
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "✅ Deploying to SIT"
            displayName: 'Deploy to SIT'